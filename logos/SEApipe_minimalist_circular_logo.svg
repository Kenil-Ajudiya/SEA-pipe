<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCircMin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="waveCircMin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glowCircMin" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="circleMaskMin">
      <circle cx="250" cy="250" r="250" />
    </clipPath>
  </defs>

  <circle cx="250" cy="250" r="250" fill="url(#bgCircMin)" />

  <g clip-path="url(#circleMaskMin)">
    <g transform="translate(250, 190)">
      <line x1="-70" y1="-8" x2="70" y2="-8" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
      <path d="M -70 15 Q -35 0 0 15 T 70 15" fill="none" stroke="url(#waveCircMin)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
      <path d="M -58 32 Q -25 15 12 32 T 58 32" fill="none" stroke="url(#waveCircMin)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <path d="M -75 50 Q -35 28 0 50 T 75 50" fill="none" stroke="url(#waveCircMin)" stroke-width="5" stroke-linecap="round" filter="url(#glowCircMin)"/>
      
      <circle cx="0" cy="-36" r="8" fill="#fbbf24" filter="url(#glowCircMin)" />
      <circle cx="0" cy="-36" r="3" fill="#ffffff" />
      <path d="M 0 -56 L 0 -18 M -20 -36 L 20 -36" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    </g>

    <text x="250" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#f8fafc" letter-spacing="1.5">
      SEA<tspan fill="#14b8a6">-pipe</tspan>
    </text>
  </g>
</svg>
