<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSqSub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="waveSqSub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glowSqSub" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="40" fill="url(#bgSqSub)" />

  <!-- Graphic Icon (Top Center) -->
  <g transform="translate(250, 150)">
    <line x1="-60" y1="-5" x2="60" y2="-5" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
    <path d="M -60 12 Q -30 0 0 12 T 60 12" fill="none" stroke="url(#waveSqSub)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M -50 25 Q -20 12 10 25 T 50 25" fill="none" stroke="url(#waveSqSub)" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M -65 40 Q -30 22 0 40 T 65 40" fill="none" stroke="url(#waveSqSub)" stroke-width="4.5" stroke-linecap="round" filter="url(#glowSqSub)"/>
    
    <circle cx="0" cy="-30" r="6.5" fill="#fbbf24" filter="url(#glowSqSub)" />
    <circle cx="0" cy="-30" r="2.5" fill="#ffffff" />
    <path d="M 0 -46 L 0 -14 M -16 -30 L 16 -30" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Typography -->
  <text x="250" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="46" fill="#f8fafc" letter-spacing="1.5">
    SEA<tspan fill="#14b8a6">-pipe</tspan>
  </text>
  
  <text x="250" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#cbd5e1" letter-spacing="0.5">
    <tspan fill="#14b8a6" font-weight="800">S</tspan>earching for <tspan fill="#14b8a6" font-weight="800">E</tspan>xotic <tspan fill="#14b8a6" font-weight="800">A</tspan>ctivity
  </text>
</svg>
